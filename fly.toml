# fly.toml app configuration file generated for savage-vps-creator on 2026-11-08T16:46:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'savage-vps-creator'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'

[processes]
  app = 'npm start'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
